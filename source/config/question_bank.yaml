# 题库：按维度出题。加岗位时在 positions/ 下新增一个 yaml，并在这里补对应维度。
by_dimension:
  system_design:
    - 请挑一个你主导过的高并发场景，说明当时的容量估算、瓶颈定位和最终架构取舍。
    - 如果核心依赖突然不可用，你的降级方案是什么？哪些请求会被牺牲、为什么？
  coding_depth:
    - 挑一段你重构过的核心代码，说明重构前后复杂度或可维护性的具体变化。
    - 你最近一次通过单元测试发现的问题是什么？测试怎么写的？
  data_storage:
    - 你设计过的索引/分片方案解决了什么查询问题？代价是什么？
    - 在一致性和可用性之间，你做过的最难的一次取舍是什么？
  collaboration:
    - 讲一次你跨团队推动落地的经历：阻力来自哪里，你怎么对齐的？
    - 你带过的同学产出不达标时，你具体做了什么？
  ownership:
    - 讲一次你负责的线上事故：你当时的位置、排查路径、根因和后续改进。
    - 你参与过的复盘里，哪一条改进后来真的改变了团队做法？
